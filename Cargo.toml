[workspace]
members = [
  "crates/aseprite-writer",
  "crates/pincel-image-core",
  "crates/pincel-image-wasm",
  "crates/pincel-core",
  "crates/pincel-effects",
  "crates/pincel-wasm",
  "src-tauri",
]
resolver = "3"

[workspace.package]
version = "1.0.1" # x-release-please-version
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amigo-labs/amigo-pincel"
rust-version = "1.88"

[workspace.dependencies]
aseprite-loader = "0.4.2"
aseprite-writer = { version = "1.0.1", path = "crates/aseprite-writer" } # x-release-please-version
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
flate2 = "1"
pincel-core = { version = "1.0.1", path = "crates/pincel-core" } # x-release-please-version
pincel-effects = { version = "1.0.1", path = "crates/pincel-effects" } # x-release-please-version
pincel-image-core = { version = "1.0.1", path = "crates/pincel-image-core" } # x-release-please-version
png = "0.18"
ab_glyph = "0.2"
thiserror = "2"
wasm-bindgen = "0.2"
# Image-mode core (pincel-image-core / pincel-image-wasm); see docs/specs/pincel.md §15, 2026-09-06.
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenRaster container for Image-mode projects (docs/specs/pincel.md §15,
# 2026-10-11). Deflate via flate2's pure-Rust backend only, so it builds
# for wasm32; no crypto / bzip2 / zstd / lzma.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
