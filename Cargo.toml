[workspace]
members = [
  "crates/aseprite-writer",
  "crates/fineliner-core",
  "crates/fineliner-wasm",
  "crates/pincel-core",
  "crates/pincel-effects",
  "crates/pincel-wasm",
  "src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amigo-labs/amigo-pincel"
rust-version = "1.88"

[workspace.dependencies]
aseprite-loader = "0.4.2"
aseprite-writer = { version = "0.1.0", path = "crates/aseprite-writer" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
flate2 = "1"
pincel-core = { version = "0.1.0", path = "crates/pincel-core" }
pincel-effects = { version = "0.1.0", path = "crates/pincel-effects" }
fineliner-core = { version = "0.1.0", path = "crates/fineliner-core" }
png = "0.18"
ab_glyph = "0.2"
thiserror = "2"
wasm-bindgen = "0.2"
# Image-mode core (fineliner-core / fineliner-wasm); see docs/specs/pincel.md §15, 2026-09-06.
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
