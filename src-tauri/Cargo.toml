[package]
name = "pincel-tauri"
version.workspace = true
description = "Pincel pixel-art editor — native desktop shell (Tauri 2)."
edition.workspace = true
license.workspace = true
repository.workspace = true
# Tauri 2.12 and its plugins need Rust 1.90; the library crates keep the
# workspace's 1.88.
rust-version = "1.90"
default-run = "pincel"

[[bin]]
name = "pincel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# pincel-core is a direct cargo dependency per CLAUDE.md §5.5 so
# native commands can call codec functions without a WASM round-trip.
# M11.2 doesn't yet exercise the dependency — the FS bridge moves
# raw bytes — but slice-aware native commands in later milestones will.
pincel-core = { workspace = true }
# System fonts for the Text tools (docs/specs/system-fonts.md, Decision Log
# 2026-11-05): pure Rust, the same on Windows, macOS and Linux, and it reuses
# the ttf-parser 0.25 that ab_glyph already brings.
fontdb = "0.24"
# The live MCP endpoint (docs/specs/mcp-live-desktop.md): the tool list and
# the in-house JSON-RPC routing of the headless server (Decision Log
# 2026-10-29).
pincel-agent = { workspace = true }
pincel-mcp = { workspace = true }
# HTTP(S) to a ComfyUI server (Decision Log 2026-11-06 "ComfyUI"), already
# in the tree through the updater plugin; TLS through rustls with the ring
# provider, installed once process-wide (Decision Log 2026-11-11).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The managed ComfyUI install (docs/specs/comfyui-install.md, Decision Log
# 2026-11-06 "Managed ComfyUI install"): pinned SHA-256 checks and the uv /
# ComfyUI archives (zip on Windows, tar.gz elsewhere), all already in the
# tree through the updater plugin.
flate2 = { workspace = true }
sha2 = "0.10"
tar = "0.4"
zip = { workspace = true }
# The native job backend (docs/specs/performance-desktop-jobs.md) runs the
# Image-mode job functions the wasm job worker runs, on all cores.
pincel-effects = { workspace = true }
pincel-image-core = { workspace = true, features = ["parallel"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
# Native clipboard read for the start-screen offer (copy-cut-paste AC-27 –
# AC-33, Decision Log 2026-11-05).
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
