[package]
name = "pincel-tauri"
version.workspace = true
description = "Pincel pixel-art editor — native desktop shell (Tauri 2)."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "pincel"

[[bin]]
name = "pincel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# pincel-core is a direct cargo dependency per CLAUDE.md §5.5 so
# native commands can call codec functions without a WASM round-trip.
# M11.2 doesn't yet exercise the dependency — the FS bridge moves
# raw bytes — but slice-aware native commands in later milestones will.
pincel-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
# Native clipboard read for the start-screen offer (copy-cut-paste AC-27 –
# AC-33, Decision Log 2026-11-05). Kept on the 2.3 line: 2.4 and later
# need tauri 2.12 and @tauri-apps/api 2.12, newer than the workspace's.
tauri-plugin-clipboard-manager = "~2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
