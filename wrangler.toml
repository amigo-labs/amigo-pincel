# Cloudflare config for pincel.amigo-labs.dev — the editor (PWA) at `/app/`,
# served as static assets by this Worker. The marketing site moved to
# amigo-labs.dev/pincel (issue #141): `cloudflare/_redirects` sends its old
# pages there.
#
# This file lives at the repo root because Cloudflare's Git integration
# (Workers Builds) reads wrangler.toml from there. scripts/cf-build.sh builds
# the editor (`ui/`, Rust → wasm included) into ui/dist/app/ and copies the
# files in `cloudflare/` (redirects, headers, 404 page) to ui/dist/.
# docs/specs/pincel.md §15, 2026-11-09.
#
# Cloudflare project name: `amigo-pincel` (matches the existing project the
# repository is connected to in the Cloudflare dashboard).
#
# This is a static-only site — no Worker entrypoint. The editor has no
# client-side routes; `/app/` serves app/index.html via the default
# trailing-slash handling.

name = "amigo-pincel"
compatibility_date = "2026-05-07"

# Workers Builds build step. Cloudflare runs this from the repo root; the
# script installs the Rust / wasm-pack toolchain the build image lacks.
[build]
command = "bash scripts/cf-build.sh"

# Serve the build output. `not_found_handling = "404-page"` tells Workers to
# serve `ui/dist/404.html` (copied from cloudflare/404.html) for any request
# that doesn't match a file or a redirect — including unknown paths under /app/.
[assets]
directory = "./ui/dist"
not_found_handling = "404-page"
