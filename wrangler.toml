# Cloudflare config for pincel.amigo-labs.dev — the marketing site at `/` and
# the editor (PWA) at `/app/`, both served as static assets by this one Worker.
#
# This file lives at the repo root because Cloudflare's Git integration
# (Workers Builds) reads wrangler.toml from there. scripts/cf-build.sh builds
# the SvelteKit site (`website/`) into website/build/, builds the editor
# (`ui/`, Rust → wasm included) and copies it into website/build/app/.
# docs/specs/pincel.md §15, 2026-10-12.
#
# Cloudflare project name: `amigo-pincel` (matches the existing project the
# repository is connected to in the Cloudflare dashboard).
#
# This is a static-only site — no Worker entrypoint, no Pages Functions. The
# SvelteKit static adapter prerenders every route at build time (see
# website/svelte.config.js and docs/specs/website-spec.md §6.2:
# "Static site generation. No SSR runtime."). The editor has no client-side
# routes; `/app/` serves app/index.html via the default trailing-slash
# handling.

name = "amigo-pincel"
compatibility_date = "2026-05-07"

# Workers Builds build step. Cloudflare runs this from the repo root; the
# script installs the Rust / wasm-pack toolchain the build image lacks.
[build]
command = "bash scripts/cf-build.sh"

# Serve the merged build output. `not_found_handling = "404-page"` tells
# Workers to serve `website/build/404.html` (provided by static/404.html) for
# any request that doesn't match a file — including unknown paths under /app/.
[assets]
directory = "./website/build"
not_found_handling = "404-page"
