# Cloudflare config for pincel.amigo-labs.dev — the editor (PWA) at the root
# (until 2026-11-11 at /app/), served as static assets by this Worker. The
# marketing site moved to amigo-labs.dev/pincel (issue #141):
# `cloudflare/_redirects` sends its old pages there.
#
# Deployed only by a release: release.yml builds the site (`pnpm build` in
# ui/, then scripts/web-site.sh adds the OCR models and cloudflare/), attaches
# it as pincel-web.zip and runs `wrangler deploy` on exactly that zip
# unpacked into ui/dist/. Cloudflare's Git integration must not deploy
# pushes any more (docs/RELEASING.md "Web deploy"; docs/specs/pincel.md §15,
# 2026-11-11).
#
# Cloudflare project name: `amigo-pincel`. This is a static-only site — no
# Worker entrypoint. The editor has no client-side routes.

name = "amigo-pincel"
compatibility_date = "2026-05-07"

# Serve the build output. `not_found_handling = "404-page"` tells Workers to
# serve `ui/dist/404.html` (copied from cloudflare/404.html) for any request
# that doesn't match a file or a redirect — including unknown paths.
[assets]
directory = "./ui/dist"
not_found_handling = "404-page"
