  { path = "f32::powf", reason = "use libm: same bits on every target" },
  { path = "f32::sin", reason = "use libm: same bits on every target" },
  { path = "f32::cos", reason = "use libm: same bits on every target" },
  { path = "f32::tan", reason = "use libm: same bits on every target" },
  { path = "f32::sin_cos", reason = "use libm: same bits on every target" },
