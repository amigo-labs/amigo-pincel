# std's transcendental float functions give different bits natively (the OS
# math library) than on wasm32 (Rust's libm port); this crate calls `libm`
# instead, so the desktop app and the browser compute the same bytes
# (docs/specs/pincel.md §15, 2026-11-11; AGENTS.md Gotchas).
disallowed-methods = [
  { path = "f32::exp", reason = "use libm: same bits on every target" },
  { path = "f32::exp2", reason = "use libm: same bits on every target" },
  { path = "f32::exp_m1", reason = "use libm: same bits on every target" },
  { path = "f32::ln", reason = "use libm: same bits on every target" },
  { path = "f32::ln_1p", reason = "use libm: same bits on every target" },
  { path = "f32::log", reason = "use libm: same bits on every target" },
  { path = "f32::log2", reason = "use libm: same bits on every target" },
