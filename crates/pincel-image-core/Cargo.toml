[package]
name = "pincel-image-core"
version.workspace = true
description = "Pure logic core for Pincel's Image mode (formerly the Fineliner image editor): document model, commands, rendering, codecs."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uuid = { workspace = true }
thiserror = { workspace = true }
# Transcendental float math with the same results on every target: wasm32
# already runs this code for `std`'s float functions, native builds would
# use the OS math library (docs/specs/pincel.md §15, 2026-11-11).
libm = "0.2"
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ab_glyph = { workspace = true }
zip = { workspace = true }
# Gradient parameter math shared with pincel-core (docs/specs/pincel.md §15,
# 2026-10-29).
pincel-effects = { workspace = true }
# TypeScript mirror of `command::spec::CommandSpec` (ts-rs), generated by
# pincel-image-wasm`s tests; see docs/specs/mcp-headless-image.md.
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"], optional = true }
# Data-parallel encoding for the desktop app's native job backend only:
# `pincel-tauri` enables `parallel`, the wasm builds never link rayon
# (docs/specs/pincel.md §15, 2026-10-29; docs/specs/performance-desktop-jobs.md).
rayon = { version = "1", optional = true }

[features]
# Derive `ts_rs::TS` on `CommandSpec` (pincel-image-wasm enables it for its
# binding export test).
ts = ["dep:ts-rs"]
# Encode the layers of an OpenRaster file, and run the effects
# (`pincel-effects/parallel`), on all cores. Results are byte-identical
# with and without it.
parallel = ["dep:rayon", "pincel-effects/parallel"]

[dev-dependencies]
criterion = { workspace = true }
insta = "1"
proptest = "1"

[[bench]]
name = "compose"
harness = false

[lints]
workspace = true
