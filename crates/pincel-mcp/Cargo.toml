[package]
name = "pincel-mcp"
version.workspace = true
description = "Pincel MCP server: lets LLM agents create and edit Pincel documents over stdio"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pincel-mcp"
path = "src/main.rs"

[dependencies]
# Enumerates the system's fonts for draw.text / font.list, as the desktop
# app does (Decision Log 2026-11-05, docs/specs/system-fonts-mcp.md).
fontdb = "0.23"
pincel-agent = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pincel-core = { workspace = true }

[lints]
workspace = true
