[package]
name = "pincel-effects"
version.workspace = true
description = "Stateless image effects and adjustments for Pincel (blur, sharpen, distort, noise, colour adjustments)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = { workspace = true }
# Transcendental float math with the same results on every target: wasm32
# already runs this code for `std`'s float functions, native builds would
# use the OS math library (docs/specs/pincel.md §15, 2026-11-11).
libm = "0.2"
# Data-parallel kernels for the desktop app's native job backend only:
# `pincel-tauri` enables `parallel`, the wasm builds never link rayon
# (docs/specs/pincel.md §15, 2026-10-29; docs/specs/performance-desktop-jobs.md).
rayon = { version = "1", optional = true }

[features]
# Run row-independent kernels on all cores. Results are byte-identical
# with and without it.
parallel = ["dep:rayon"]

[lints]
workspace = true
