[package]
name = "pincel-image-wasm"
version.workspace = true
description = "WebAssembly bindings for Pincel's Image mode core (pincel-image-core; wasm-bindgen / wasm-pack target)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pincel-image-core = { workspace = true }
pincel-effects = { workspace = true }
# Enables uuid's JS getrandom backend so v4 UUIDs work under wasm32.
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = { workspace = true }
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
# The `ts` feature derives `ts_rs::TS` on `CommandSpec` for the binding
# export test (docs/specs/mcp-headless-image.md, Technical notes).
pincel-image-core = { workspace = true, features = ["ts"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }

[lints]
workspace = true

# Same policy as pincel-wasm: wasm-pack's bundled binaryen download fails in
# sandboxed builds, so CI runs a system `wasm-opt` after the build instead
# (see .github/workflows/release.yml).
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
