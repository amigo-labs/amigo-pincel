[package]
name = "pincel-wasm"
version.workspace = true
description = "WebAssembly bindings for the Pincel core (wasm-bindgen / wasm-pack target)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Live agent calls on the open document (docs/specs/mcp-live-desktop.md,
# Decision Log 2026-10-29: the tools run in the webview's wasm).
pincel-agent = { workspace = true }
pincel-core = { workspace = true }
pincel-effects = { workspace = true }
pincel-trace = { workspace = true }
# pincel-agent brings pincel-image-core, whose layer ids are v4 UUIDs: the
# `js` feature gives them the browser's randomness under wasm32, as in
# pincel-image-wasm.
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

# wasm-pack ships its own pinned binaryen and downloads it from GitHub on
# first use, which fails in sandboxed / firewalled build environments.
# Disable wasm-pack's bundled pass and
# let CI run a system `wasm-opt` (installed via apt) after the build — see
# .github/workflows/release.yml. Release-profile rustc optimizations still
# apply; only the post-build binaryen pass is deferred to the explicit step.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

