downloads:
  files:
    - os: windows
      label: Installer (.exe)
      arch: x64
      asset: pincel-windows-x64-setup.exe
      note: { en: Windows 10 or 11; installs for you only, de: Windows 10 oder 11; installiert nur für dich }
    - os: windows
      label: { en: MSI package, de: MSI-Paket }
      arch: x64
      asset: pincel-windows-x64.msi
      note: { en: For all users; needs administrator rights, de: Für alle Benutzer; braucht Administratorrechte }
    - os: macos
      label: { en: Disk image (.dmg), de: Disk-Image (.dmg) }
      arch: universal
      asset: pincel-macos-universal.dmg
      note: { en: macOS 10.13 or newer; Apple silicon and Intel, de: macOS 10.13 oder neuer; Apple Silicon und Intel }
    - os: linux
      label: AppImage
      arch: x64
      asset: pincel-linux-x64.AppImage
      note: { en: glibc 2.35 or newer (Ubuntu 22.04 and later), de: glibc 2.35 oder neuer (Ubuntu 22.04 und später) }
    - os: linux
      label: ".deb (Debian, Ubuntu)"
      arch: x64
      asset: pincel-linux-x64.deb
    - os: linux
      label: ".rpm (Fedora, openSUSE)"
      arch: x64
      asset: pincel-linux-x64.rpm
    # The MCP server for AI agents (README.md, "Use Pincel from an AI agent").
    - os: windows
      label: MCP server (pincel-mcp)
      arch: x64
      asset: pincel-mcp-windows-x64.exe
      note: &mcp-note
        en: Lets Claude and other MCP clients create, draw and export documents
        de: Lässt Claude und andere MCP-Clients Dokumente anlegen, bemalen und exportieren
    - os: macos
      label: MCP server (pincel-mcp)
      arch: universal
      asset: pincel-mcp-macos-universal
      note: *mcp-note
    - os: linux
      label: MCP server (pincel-mcp)
      arch: x64
      asset: pincel-mcp-linux-x64
      note: *mcp-note
  checksums: SHA256SUMS
  install:
    - label: { en: Install the AppImage for you (Linux), de: AppImage für dich installieren (Linux) }
      command: chmod +x pincel-linux-x64.AppImage && ./pincel-linux-x64.AppImage --install
      note:
        en: Run it where you downloaded the AppImage. No root needed.
        de: Im Ordner des heruntergeladenen AppImage ausführen. Ohne root.
      requiresRelease: true
    - label: { en: Register pincel-mcp with Claude Code, de: pincel-mcp in Claude Code anmelden }
      command: claude mcp add pincel -- pincel-mcp --workspace .
      note:
        en: After putting the downloaded pincel-mcp binary on your PATH; the current folder becomes the workspace.
        de: Nachdem das heruntergeladene Programm pincel-mcp im PATH liegt; der aktuelle Ordner wird zum Arbeitsbereich.
      requiresRelease: true
  guide:
    windows:
      en: |
        The installer sets Pincel up for you only, in `%LOCALAPPDATA%\Pincel`, without administrator rights, with a Start menu entry. It registers Pincel for `.aseprite`, PNG, JPEG, WebP, and the other formats it opens; Windows lets only you choose the default app, so the first install opens Settings → Default apps on Pincel's page. Uninstall: Settings → Apps → Installed apps. The MSI package installs for all users and needs administrator rights. Windows on ARM runs the x64 build through the built-in emulation.

        **First start:** the installer is not signed with a code-signing certificate, so SmartScreen shows "Windows protected your PC". Click **More info**, then **Run anyway**.
      de: |
        Der Installer richtet Pincel nur für dich ein, in `%LOCALAPPDATA%\Pincel`, ohne Administratorrechte und mit einem Eintrag im Startmenü. Er meldet Pincel für `.aseprite`, PNG, JPEG, WebP und die übrigen Formate an, die es öffnet; die Standard-App wählst unter Windows nur du selbst, deshalb öffnet die erste Installation Einstellungen → Standard-Apps auf der Seite von Pincel. Deinstallieren: Einstellungen → Apps → Installierte Apps. Das MSI-Paket installiert für alle Benutzer und braucht Administratorrechte. Windows auf ARM führt den x64-Build über die eingebaute Emulation aus.

        **Erster Start:** Der Installer ist nicht mit einem Code-Signing-Zertifikat signiert, deshalb zeigt SmartScreen „Der Computer wurde durch Windows geschützt“. Klicke auf **Weitere Informationen**, dann auf **Trotzdem ausführen**.
    macos:
      en: |
        Open the disk image and drag Pincel into Applications. Finder then offers it under "Open With" for the formats it opens; make it the default through "Get Info" → "Open with" → "Change All".

        **First start:** the app is not notarized by Apple, so macOS won't open it at first. Control-click it in Applications, choose **Open**, and confirm; on macOS 15 and newer, open it once, then go to System Settings → Privacy & Security → **Open Anyway**. Or in Terminal:

        ```bash
        xattr -dr com.apple.quarantine /Applications/Pincel.app
        ```
      de: |
        Öffne das Disk-Image und ziehe Pincel in „Programme“. Der Finder bietet es dann unter „Öffnen mit“ für die Formate an, die es öffnet; zur Standard-App wird es über „Informationen“ → „Öffnen mit“ → „Alle ändern“.

        **Erster Start:** Die App ist nicht von Apple notarisiert, deshalb öffnet macOS sie zunächst nicht. Klicke sie in „Programme“ mit gedrückter Ctrl-Taste an, wähle **Öffnen** und bestätige; ab macOS 15 öffnest du sie einmal und gehst dann zu Systemeinstellungen → Datenschutz & Sicherheit → **Dennoch öffnen**. Oder im Terminal:

        ```bash
        xattr -dr com.apple.quarantine /Applications/Pincel.app
        ```
    linux:
      en: |
        Requires x64 with glibc 2.35 or newer: Ubuntu 22.04, Debian 12, Fedora 36, and later.

        The AppImage runs as downloaded once it is executable. Installed for you with `--install` (above), it gets a `pincel` command, an application-menu entry, and "Open with" for its formats: that copies it to `~/.local/share/pincel` and links `~/.local/bin/pincel`; uninstall with `pincel --uninstall`. On Ubuntu 24.04 and newer, AppImages need `libfuse2t64` (`sudo apt install libfuse2t64`). The .deb and .rpm packages install through your package manager instead and are updated with it.
      de: |
        Voraussetzung: x64 mit glibc 2.35 oder neuer: Ubuntu 22.04, Debian 12, Fedora 36 und später.

        Das AppImage läuft so, wie es heruntergeladen wurde, sobald es ausführbar ist. Mit `--install` (oben) für dich installiert, bekommt es einen Befehl `pincel`, einen Eintrag im Anwendungsmenü und „Öffnen mit“ für seine Formate: Das kopiert es nach `~/.local/share/pincel` und verlinkt `~/.local/bin/pincel`; deinstallieren mit `pincel --uninstall`. Ab Ubuntu 24.04 brauchen AppImages `libfuse2t64` (`sudo apt install libfuse2t64`). Die Pakete .deb und .rpm installieren stattdessen über den Paketmanager und werden mit ihm aktualisiert.
    all:
      en: |
        **Verify:** the checksums of all files are in `SHA256SUMS`. On Windows: `Get-FileHash pincel-windows-x64-setup.exe`; on macOS and Linux: `shasum -a 256` or `sha256sum`.

        **Updates:** the desktop app asks GitHub at most once a day for a new version, downloads it in the background, and checks its signature before installing; it takes effect at the next start (on Windows once you quit Pincel). Help → **Check for Updates…** checks right away, Help → **Install Updates Automatically** turns it off. The .deb and .rpm packages and an AppImage that was not installed with `--install` leave updates to you.

        **MCP server:** rename the downloaded `pincel-mcp-…` file to `pincel-mcp` (`pincel-mcp.exe` on Windows), make it executable (`chmod +x`) and put it on your `PATH`. Options: `--workspace <dir>` (default: the current folder; files are read and written only inside it) and `--read-only`.

        **Or just use the browser:** nothing to install — the editor runs in any modern browser, works offline, and installs from there as an app (PWA). Your files stay on your device either way.
      de: |
        **Prüfen:** Die Prüfsummen aller Dateien stehen in `SHA256SUMS`. Unter Windows: `Get-FileHash pincel-windows-x64-setup.exe`, unter macOS und Linux: `shasum -a 256` bzw. `sha256sum`.

        **Updates:** Die Desktop-App fragt höchstens einmal am Tag bei GitHub nach einer neuen Version, lädt sie im Hintergrund und prüft vor der Installation ihre Signatur; aktiv wird sie beim nächsten Start (unter Windows, sobald du Pincel beendest). Hilfe → **Nach Updates suchen…** prüft sofort, Hilfe → **Updates automatisch installieren** schaltet es ab. Die Pakete .deb und .rpm sowie ein AppImage, das nicht mit `--install` installiert wurde, überlassen Updates dir.

        **MCP-Server:** Die heruntergeladene Datei `pincel-mcp-…` in `pincel-mcp` umbenennen (`pincel-mcp.exe` unter Windows), ausführbar machen (`chmod +x`) und in den `PATH` legen. Optionen: `--workspace <dir>` (Standard: der aktuelle Ordner; Dateien werden nur darin gelesen und geschrieben) und `--read-only`.

        **Oder einfach im Browser:** Nichts zu installieren – der Editor läuft in jedem aktuellen Browser, funktioniert offline und lässt sich von dort als App (PWA) installieren. Deine Dateien bleiben so oder so auf deinem Gerät.
