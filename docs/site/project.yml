sections:
  - id: how-it-works
    title: { en: How it works, de: So funktioniert es }
    body:
      en: |
        1. **Open** — drag in a `.aseprite` file or start fresh.
        2. **Edit** — paint, animate, build tilemaps, define slices.
        3. **Save** — save back to `.aseprite`. Your engine hot-reloads.
      de: |
        1. **Öffnen** – eine `.aseprite`-Datei hineinziehen oder neu anfangen.
        2. **Bearbeiten** – malen, animieren, Tilemaps bauen, Slices festlegen.
        3. **Speichern** – zurück als `.aseprite` speichern. Deine Engine lädt neu.

