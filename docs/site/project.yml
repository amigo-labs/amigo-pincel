features:
  - title: { en: The canvas, de: Die Arbeitsfläche }
    text:
      en: Smooth zoom and pan up to 64× with pixel-perfect rendering, cursor-anchored wheel zoom and auto-fit on open. WebGPU rendering with a Canvas2D fallback.
      de: Flüssiges Zoomen und Verschieben bis 64×, pixelgenau dargestellt, mit Mausrad-Zoom am Cursor und automatischem Einpassen beim Öffnen. WebGPU-Rendering mit Canvas2D als Rückfallebene.
  - title: { en: Tools, de: Werkzeuge }
    text:
      en: Pencil, eraser, bucket, line, rectangles, ellipses, rounded rectangles, polygons, eyedropper, move, text, and rectangle / ellipse / lasso / polygon / magic-wand selections. Each tool is small, focused and built around pixel-perfect input.
      de: Stift, Radierer, Füllen, Linie, Rechtecke, Ellipsen, abgerundete Rechtecke, Polygone, Pipette, Verschieben, Text sowie Rechteck-, Ellipsen-, Lasso-, Polygon- und Zauberstab-Auswahl. Jedes Werkzeug ist klein, fokussiert und auf pixelgenaue Eingabe gebaut.
  - title: { en: Layers, de: Ebenen }
    text:
      en: Image layers, group layers, blend modes, opacity, visibility and locking, with thumbnails and drag-to-reorder. The Aseprite layer model — round-trips through Pincel and back into Aseprite without loss.
      de: Bildebenen, Gruppen, Mischmodi, Deckkraft, Sichtbarkeit und Sperre, mit Vorschaubildern und Umsortieren per Ziehen. Das Ebenenmodell von Aseprite – verlustfrei hin und zurück zwischen Pincel und Aseprite.
  - title: { en: Frames and animation, de: Frames und Animation }
    text:
      en: A timeline with per-frame durations, named tags with forward / reverse / ping-pong playback, onion skin, and sprite-sheet export with Aseprite-format JSON. Everything round-trips through the .aseprite file.
      de: Eine Zeitleiste mit Dauer pro Frame, benannte Tags mit Vorwärts-, Rückwärts- und Ping-Pong-Wiedergabe, Zwiebelhaut und Sprite-Sheet-Export mit JSON im Aseprite-Format. Alles bleibt in der .aseprite-Datei erhalten.
  - title: Tilemaps
    text:
      en: First-class tilemap layers. Build a tileset, stamp tiles on the canvas, flip and rotate per tile, and edit a tile in place to update it everywhere it appears.
      de: Vollwertige Tilemap-Ebenen. Ein Tileset anlegen, Kacheln auf die Fläche stempeln, einzelne Kacheln spiegeln und drehen und eine Kachel direkt bearbeiten, damit sie sich überall ändert.
  - title: Slices
    text:
      en: Named rectangular regions, optionally with 9-patch borders and pivot points, for hitboxes, UI and game logic. Your engine reads them straight out of the .aseprite file.
      de: Benannte rechteckige Bereiche, wahlweise mit 9-Patch-Rändern und Drehpunkten, für Hitboxen, UI und Spiellogik. Deine Engine liest sie direkt aus der .aseprite-Datei.
  - title: { en: Palette, de: Palette }
    text:
      en: New sprites start with DB32; switch to DB16, PICO-8, Game Boy or NES in one click. Import and export GIMP .gpl palettes, and recolor, add, delete and drag-reorder entries.
      de: Neue Sprites starten mit DB32; mit einem Klick zu DB16, PICO-8, Game Boy oder NES wechseln. GIMP-Paletten (.gpl) importieren und exportieren, Einträge umfärben, hinzufügen, löschen und per Ziehen umsortieren.
  - title: { en: Open file formats, de: Offene Dateiformate }
    text:
      en: Aseprite read and write are the source of truth — layer flags, user data and grid settings survive the trip. PNG frame export and sprite sheets with Aseprite-compatible JSON; Image mode saves OpenRaster (.ora). No proprietary format lock-in, ever.
      de: Lesen und Schreiben von Aseprite sind die Grundlage – Ebenen-Flags, Benutzerdaten und Rastereinstellungen bleiben erhalten. PNG-Export einzelner Frames und Sprite-Sheets mit Aseprite-kompatiblem JSON; der Bild-Modus speichert OpenRaster (.ora). Nie ein proprietäres Format.
  - title: { en: Image mode, de: Bild-Modus }
    text:
      en: A paint.net-style editor in the same app for everything that is not pixel art. PNG, JPEG, WebP, BMP, GIF and TIFF open with layers, blend modes, brushes, shapes, text, selections, transforms and the full set of effects and adjustments. Save as OpenRaster to keep the layers, or export flat images.
      de: Ein Editor im Stil von paint.net in derselben App für alles, was keine Pixel-Art ist. PNG, JPEG, WebP, BMP, GIF und TIFF öffnen mit Ebenen, Mischmodi, Pinseln, Formen, Text, Auswahlen, Transformationen und allen Effekten und Korrekturen. Als OpenRaster speichern, um die Ebenen zu behalten, oder flach exportieren.
  - title: { en: Tablet and pen, de: Tablet und Stift }
    text:
      en: Two-finger pan and pinch-to-zoom in both modes. On-screen Shift and Alt toggles stand in for the keyboard, and the Image-mode brush follows pen pressure and tilt.
      de: Verschieben und Pinch-Zoom mit zwei Fingern in beiden Modi. Umschalt- und Alt-Schalter auf dem Bildschirm ersetzen die Tastatur, und der Pinsel im Bild-Modus folgt Druck und Neigung des Stifts.
    status: in-progress
  - title: { en: Desktop app, de: Desktop-App }
    text:
      en: Native builds for Windows, macOS and Linux with the system file dialogs, file associations and "Open with" from Explorer, Finder or the file manager. It installs for you only, without administrator rights, and updates itself in the background — every update signature-checked.
      de: Native Builds für Windows, macOS und Linux mit den Dateidialogen des Systems, Dateizuordnungen und „Öffnen mit“ aus Explorer, Finder oder Dateimanager. Er installiert sich nur für dich, ohne Administratorrechte, und hält sich im Hintergrund aktuell – jedes Update mit geprüfter Signatur.
  - title: { en: Offline in the browser, de: Offline im Browser }
    text:
      en: Install Pincel from your browser as a PWA. It works offline, autosaves to IndexedDB and keeps your files on your device. The editor speaks English and German.
      de: Pincel aus dem Browser als PWA installieren. Es funktioniert offline, speichert automatisch in IndexedDB und behält deine Dateien auf deinem Gerät. Der Editor spricht Deutsch und Englisch.
  - title: { en: Embeddable, de: Einbettbar }
    text:
      en: An npm package to mount the same editor in any DOM element of your own tool, built on pincel-core (Rust → WASM). Read and write Aseprite files and listen for changes, no iframe.
      de: Ein npm-Paket, um denselben Editor in jedes DOM-Element deines eigenen Tools einzuhängen, gebaut auf pincel-core (Rust → WASM). Aseprite-Dateien lesen und schreiben und auf Änderungen hören, ohne iframe.
    status: in-progress
  - title: { en: What's coming, de: Was als Nächstes kommt }
    text:
      en: Lua scripting. Custom brushes. A headless Node API for asset pipelines. A read-only viewer for embeds.
      de: Lua-Skripte. Eigene Pinsel. Eine Node-API ohne Oberfläche für Asset-Pipelines. Ein reiner Betrachter zum Einbetten.
    status: planned

