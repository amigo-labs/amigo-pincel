# Pincel on amigo-labs.dev. Format: amigo-labs/website docs/project-data.md.
# Versions, downloads and release notes come from the GitHub releases.
schema: 1
slug: pincel
name: Pincel
status: released
accent: "#29adff"
icon: icon.svg
tagline:
  en: Pixel-art and image editor
  de: Pixel-Art- und Bildeditor
summary:
  en: >-
    A pixel-art and image editor for the web and the desktop: Aseprite-compatible
    sprites, tilemaps, slices and animation, plus layered editing of photos and
    screenshots with brushes, selections and effects. Open source, free, no account,
    no upload.
  de: >-
    Ein Pixel-Art- und Bildeditor für Web und Desktop: Aseprite-kompatible Sprites,
    Tilemaps, Slices und Animation, dazu Bildbearbeitung mit Ebenen, Pinseln,
    Auswahlen und Effekten für Fotos und Screenshots. Open Source, kostenlos, kein
    Konto, kein Upload.
about:
  en: |
    Pincel is two editors in one app, and the file decides which one opens.
    **Pixel mode** is built for game developers and pixel artists: it reads and writes
    the Aseprite file format, so your work fits into existing pipelines, with tilemaps,
    slices, animation tags, palettes and indexed color — the things you actually need.
    **Image mode** is a full paint.net-style editor for everything else — photos,
    screenshots, UI mockups, artwork — with layers, blend modes, brushes, selections,
    transforms, effects and adjustments; it opens PNG, JPEG, WebP, BMP, GIF and TIFF
    and saves OpenRaster so GIMP and Krita open it too.

    Both run offline as a PWA or as a desktop app, speak English and German, and work
    on an iPad. Pincel is open source under MIT or Apache 2.0, and it will stay that
    way. It uses Aseprite's documented file format and is not affiliated with the
    Aseprite project.
  de: |
    Pincel sind zwei Editoren in einer App, und die Datei entscheidet, welcher sich
    öffnet. Der **Pixel-Modus** ist für Spieleentwickler und Pixel-Künstler gemacht: Er
    liest und schreibt das Aseprite-Format, sodass deine Arbeit in bestehende Pipelines
    passt, mit Tilemaps, Slices, Animations-Tags, Paletten und indizierten Farben – das,
    was man wirklich braucht. Der **Bild-Modus** ist ein vollwertiger Editor im Stil von
    paint.net für alles andere – Fotos, Screenshots, UI-Entwürfe, Grafiken – mit Ebenen,
    Mischmodi, Pinseln, Auswahlen, Transformationen, Effekten und Korrekturen; er öffnet
    PNG, JPEG, WebP, BMP, GIF und TIFF und speichert OpenRaster, das auch GIMP und Krita
    öffnen.

    Beide laufen offline als PWA oder als Desktop-App, sprechen Deutsch und Englisch und
    funktionieren auf dem iPad. Pincel ist Open Source unter MIT oder Apache 2.0, und das
    bleibt so. Es nutzt das dokumentierte Dateiformat von Aseprite und ist nicht mit dem
    Aseprite-Projekt verbunden.
platforms: [windows, macos, linux, web]
license: MIT OR Apache-2.0
launch:
  label: { en: Open the editor, de: Editor öffnen }
  url: https://pincel.amigo-labs.dev/app/

