# Cloudflare config for the Pincel *editor* (the PWA), deployed by the
# guarded `deploy-web` job in .github/workflows/release.yml.
#
# This is separate from the repo-root wrangler.toml, which Cloudflare's
# Git integration uses to build & serve the marketing site (project
# `amigo-pincel`). The editor is a distinct Worker project (`pincel-app`)
# whose static assets are the prebuilt `ui/dist/` bundle — the release
# workflow builds it and hands it to `wrangler deploy`, so there is no
# `[build]` step here.
#
# The deploy job only runs when the `CLOUDFLARE_API_TOKEN` (and
# `CLOUDFLARE_ACCOUNT_ID`) repo secrets are set; without them it is
# skipped, so this file is inert until you opt in. See docs/RELEASING.md.

name = "pincel-app"
compatibility_date = "2026-05-07"

# The editor lives at https://pincel.amigo-labs.dev/app/ (the marketing
# site's Worker owns the rest of the hostname via its Custom Domain; a
# route runs before a Custom Domain on the same host, so this route wins
# for `/app*`). `workers_dev = false`: the route is the only entry point.
workers_dev = false
routes = [
  { pattern = "pincel.amigo-labs.dev/app*", zone_name = "amigo-labs.dev" },
]

# Serve the prebuilt bundle. Workers static assets match the full request
# path, so the Vite web build writes into `dist/app/` (ui/vite.config.ts,
# `base: '/app/'`) and the asset root stays `dist/`. `/app` redirects to
# `/app/` and serves `app/index.html` via the default trailing-slash
# handling. The editor has no client-side routes, so unmatched paths get a
# plain 404 rather than an SPA fallback (which would look for a root
# `index.html` that does not exist).
[assets]
directory = "./dist"
not_found_handling = "none"
