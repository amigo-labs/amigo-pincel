# CI gate for the repo (see AGENTS.md §10 for the per-crate commands).
#
# The Rust library crates build without system libraries, so they run in a
# fast, dependency-free job. The Tauri shell (pincel-tauri) needs GTK/WebKit
# system libraries, so it gets its own job that installs them. The UI job
# builds the wasm packages first (local `link:` dependencies) before linting,
# type-checking and building the Svelte frontend; the Playwright suite runs
# in `e2e`, split into shards that each build the bundle themselves (the
# suite is ~1500 short tests whose cost is page start-up, so only more
# machines make it faster). (The marketing site moved to
# amigo-labs.dev/pincel, issue #141; its data in docs/site/ is checked by
# site-data.yml.)
#
# A pull request that only touches documentation (docs/, Markdown at the
# repository root, the agent configuration in .agents/ and .claude/) skips
# the build and test jobs; `ci-ok` sums up all jobs into one check either
# way. Pushes to main always run everything.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: code changed?
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          # Documentation only: docs/, root-level Markdown, agent config.
          # Markdown elsewhere can be code (pincel-agent include_str!s its
          # guide.md), so it counts as code.
          code=$(printf '%s\n' "$files" | grep -Ev '^(docs/|\.agents/|\.claude/|[^/]+\.md$)' | grep -c . || true)
          if [ -z "$files" ] || [ "$code" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: rust core (fmt / clippy / test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p pincel-core -p pincel-effects -p pincel-trace -p pincel-ocr -p aseprite-writer -p pincel-wasm -p pincel-image-core -p pincel-image-wasm -p pincel-agent -p pincel-mcp --all-targets -- -D warnings
      - name: test
        run: cargo test -p pincel-core -p pincel-effects -p pincel-trace -p pincel-ocr -p aseprite-writer -p pincel-wasm -p pincel-image-core -p pincel-image-wasm -p pincel-agent -p pincel-mcp
      - name: generated TS bindings are current (image mode, ts-rs)
        run: git diff --exit-code -- ui/src/modes/image/core/generated/

  tauri:
    name: tauri shell (check)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped from the implicit v0: the old cache was filled by a job
          # whose `cargo check` only ever produced .rmeta, so `cargo test`
          # rebuilt the whole tauri tree (1m43s) on every run and never got
          # to store it back -- rust-cache skips saving on a full key match.
          prefix-key: v1-rust
      # `cargo test` compiles strictly more than `cargo check`, so a separate
      # check step only duplicated work.
      - name: test
        run: cargo test -p pincel-tauri

  ui:
    name: ui (lint / check / build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Pinned: `latest` lets a new wasm-pack release break builds
          # unannounced.
          tool: wasm-pack@0.13.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: build wasm package
        run: pnpm wasm:build
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: type-check
        run: pnpm check
      - name: build
        run: pnpm build

  e2e:
    name: ui e2e (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports its own failures, so one red shard does not hide
      # the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: build wasm package
        run: pnpm wasm:build
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      # Playwright drives the built bundle through `vite preview`
      # (ui/playwright.config.ts). The browser download is cached; the
      # @playwright/test version is pinned by pnpm-lock.yaml, so its hash
      # is an exact key. System libraries live outside the cache and are
      # installed separately on a hit.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - name: install playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: install playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: e2e
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ui/playwright-report
          retention-days: 7

  ci-ok:
    name: CI ok
    needs: [changes, rust, tauri, ui, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Skipped jobs (a documentation-only pull request) count as passed;
      # a failed or cancelled one fails this check.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
