name: Release

# Builds the release for a tag v<version>, as in amigo-blinzel: the web
# (PWA) bundle, the desktop installers for Windows (x64), macOS
# (universal) and Linux (x64) with their signed updater artifacts,
# SHA256SUMS and the updater manifest latest.json, all attached to the
# tag's GitHub release, which is then published. release-please.yml calls
# this after a release PR is merged (it creates the tag and the draft
# release); by hand, run it for an existing tag. See docs/RELEASING.md.
#
# The web deploy (site + editor at /app/) is not done here: Cloudflare's
# Git integration builds and serves it from main (root wrangler.toml,
# scripts/cf-build.sh).
#
# No code signing certificate: Windows SmartScreen and macOS Gatekeeper
# warn on first launch. The updater only installs what is signed with the
# Tauri updater key.
#
# Needed (organization secrets of amigo-labs; a repository secret of the
# same name would shadow them):
#   secret   TAURI_SIGNING_PRIVATE_KEY           the organization's updater key
#   secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#
# The npm publish needs no secret: `publish-npm` authenticates through
# OIDC trusted publishing and runs when the repository variable
# PUBLISH_NPM is `true`. See docs/RELEASING.md.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (e.g. v1.0.0)
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: only the publish job may write (attach and publish).
permissions:
  contents: read

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the crate version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v$version" = "$TAG" || { echo "tag $TAG != v$version"; exit 1; }
      - name: Updater public key is set
        run: |
          if grep -q REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "src-tauri/tauri.conf.json has no updater public key (docs/RELEASING.md)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: gate — rust core tests
        run: cargo test -p pincel-core -p pincel-effects -p aseprite-writer -p pincel-wasm -p pincel-image-core -p pincel-image-wasm
      - name: build wasm packages (release profile)
        working-directory: ui
        run: pnpm wasm:build:release
      - name: optimize wasm (system binaryen)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binaryen
          for wasm in crates/pincel-wasm/pkg/pincel_wasm_bg.wasm crates/pincel-image-wasm/pkg/pincel_image_wasm_bg.wasm; do
            wasm-opt -O3 -o "$wasm" "$wasm"
            ls -lh "$wasm"
          done
      - name: install ui dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: build web app
        working-directory: ui
        env:
          VITE_APP_VERSION: ${{ inputs.tag }}
        run: pnpm build
      - name: package web bundle
        run: |
          mkdir dist
          ( cd ui/dist && zip -qr ../../dist/pincel-web.zip . )
          ls -lh dist/pincel-web.zip
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/pincel-web.zip

  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: windows-x64
            args: ''
            bundle: target/release/bundle
          - name: macOS universal
            runner: macos-14
            artifact: macos-universal
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
          # The oldest supported Ubuntu: its glibc (2.35) sets the minimum.
          - name: Linux x64
            runner: ubuntu-22.04
            artifact: linux-x64
            args: ''
            bundle: target/release/bundle
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Updater signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY secret is missing"; exit 1; }
      - name: install linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: build wasm packages (release profile)
        working-directory: ui
        run: pnpm wasm:build:release
      - name: install ui dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      # tauri.conf.json's beforeBuildCommand builds ui/dist; the wasm
      # packages and node_modules above are its prerequisites.
      - name: build desktop bundles
        working-directory: ui
        env:
          # The CLI looks for tauri.conf.json in the working directory and
          # below, never in the sibling src-tauri/.
          TAURI_APP_PATH: ../src-tauri
          VITE_APP_VERSION: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.args }}
      # Stable names, so releases/latest/download/<name> links and
      # latest.json keep working across versions.
      - name: Name the files
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          shopt -s failglob
          mkdir dist
          case "$OS" in
            Windows)
              cp "$BUNDLE"/nsis/*-setup.exe          dist/pincel-windows-x64-setup.exe
              cp "$BUNDLE"/nsis/*-setup.exe.sig      dist/pincel-windows-x64-setup.exe.sig
              cp "$BUNDLE"/msi/*.msi                 dist/pincel-windows-x64.msi
              cp "$BUNDLE"/msi/*.msi.sig             dist/pincel-windows-x64.msi.sig
              ;;
            macOS)
              cp "$BUNDLE"/dmg/*.dmg                 dist/pincel-macos-universal.dmg
              cp "$BUNDLE"/macos/*.app.tar.gz        dist/pincel-macos-universal.app.tar.gz
              cp "$BUNDLE"/macos/*.app.tar.gz.sig    dist/pincel-macos-universal.app.tar.gz.sig
              ;;
            Linux)
              cp "$BUNDLE"/appimage/*.AppImage       dist/pincel-linux-x64.AppImage
              cp "$BUNDLE"/appimage/*.AppImage.sig   dist/pincel-linux-x64.AppImage.sig
              cp "$BUNDLE"/deb/*.deb                 dist/pincel-linux-x64.deb
              cp "$BUNDLE"/rpm/*.rpm                 dist/pincel-linux-x64.rpm
              ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    name: Checksums and release
    needs: [web, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum pincel-* | grep -v '\.sig$' > SHA256SUMS && cat SHA256SUMS
      # `tauri build` signs with whatever key the secret holds; the app
      # accepts only the key in plugins.updater.pubkey. A mismatch (say, a
      # repository secret shadowing the organization's) would publish
      # updates no installed copy accepts, so it stops the release here.
      # The one release of a key rotation that carries the new public key
      # but is still signed with the old key sets the repository variable
      # UPDATER_SIGNING_KEY_ID to the old key's ID (docs/RELEASING.md).
      - name: Signatures match the updater key
        env:
          EXPECTED_KEY_ID: ${{ vars.UPDATER_SIGNING_KEY_ID }}
        run: |
          python3 - <<'EOF'
          import base64, glob, json, os, sys

          def key_id(text):
              # minisign: base64 of a comment line and a base64 key or
              # signature whose bytes 2..10 are the key ID.
              line = base64.b64decode(text).decode().splitlines()[1]
              return base64.b64decode(line)[2:10][::-1].hex().upper()

          conf = json.load(open("src-tauri/tauri.conf.json"))
          want = key_id(conf["plugins"]["updater"]["pubkey"])
          override = os.environ.get("EXPECTED_KEY_ID", "").strip().upper()
          if override:
              print(f"::warning::UPDATER_SIGNING_KEY_ID: expecting key {override}, the app trusts {want}")
              want = override
          sigs = sorted(glob.glob("dist/*.sig"))
          bad = [(p, key_id(open(p).read())) for p in sigs]
          bad = [(p, k) for p, k in bad if k != want]
          for p, k in bad:
              print(f"::error::{p} is signed by key {k}, expected {want}")
          if len(sigs) < 4 or bad:
              sys.exit(1)
          print(f"{len(sigs)} signatures by key {want}")
          EOF
      # The updater manifest (tauri-plugin-updater's static JSON). The
      # notes are the draft's changelog that release-please wrote.
      - name: latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes="$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)"
          entry() { jq -n --arg url "$BASE/$1" --rawfile sig "dist/$1.sig" '{signature: $sig, url: $url}'; }
          nsis="$(entry pincel-windows-x64-setup.exe)"
          msi="$(entry pincel-windows-x64.msi)"
          mac="$(entry pincel-macos-universal.app.tar.gz)"
          appimage="$(entry pincel-linux-x64.AppImage)"
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson nsis "$nsis" --argjson msi "$msi" \
            --argjson mac "$mac" --argjson appimage "$appimage" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis, "windows-x86_64-msi": $msi,
              "darwin-aarch64": $mac, "darwin-x86_64": $mac,
              "linux-x86_64": $appimage, "linux-x86_64-appimage": $appimage
            }}' > dist/latest.json
          cat dist/latest.json
      # release-please created the tag's release as a draft (with the
      # changelog as notes); the files go up first, then it is published,
      # so the updaters never see a release without its files.
      - name: Attach the files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Pincel ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" --clobber dist/*
          gh release edit "$TAG" --draft=false --latest --title "Pincel ${TAG#v}"

  # Authenticates through npm's OIDC trusted publishing, not a token:
  # npm revoked all classic tokens in December 2025, and a granular
  # token of the "Read and write (stage only)" kind — the one npm steers
  # automation to — may not publish a version at all. The publish needs
  # `id-token: write` and npm >= 11.5.1, and npm attaches a provenance
  # attestation on its own.
  #
  # The trusted publisher is configured once in the package settings on
  # npmjs.com and names **release-please.yml**, not this file: npm
  # validates the entry workflow of the run, not the one holding the
  # `npm publish` (docs.npmjs.com/trusted-publishers, Troubleshooting),
  # and automatic releases enter through release-please.yml's
  # `workflow_call`. npm allows one trusted publisher per package, so a
  # `workflow_dispatch` run of this file — a rebuild on an existing tag —
  # carries an identity no entry can match and is skipped below; publish
  # that one by hand (docs/RELEASING.md).
  publish-npm:
    name: publish @amigo-labs/pincel-wasm to npm (guarded)
    needs: [web, publish]
    if: vars.PUBLISH_NPM == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14; `22` resolves to the
          # latest 22.x. No NODE_AUTH_TOKEN: `registry-url` only pins the
          # registry the OIDC exchange runs against.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: npm with trusted-publishing support
        # The runner image ships an older npm with Node 22; OIDC needs
        # 11.5.1 or later.
        run: npm install -g npm@latest
      - name: build wasm package (release profile)
        working-directory: ui
        run: pnpm wasm:build:release
      - name: optimize wasm (system binaryen)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt -O3 -o crates/pincel-wasm/pkg/pincel_wasm_bg.wasm crates/pincel-wasm/pkg/pincel_wasm_bg.wasm
      # The crate already carries the release version; this only guards
      # a manual run on an older tag.
      - name: stamp package version
        working-directory: crates/pincel-wasm/pkg
        env:
          TAG: ${{ inputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      # wasm-pack copies the crate's license files into pkg/ but leaves
      # them out of the `files` it generates, and npm only ever includes
      # a file named exactly LICENSE on its own. Without this the tarball
      # ships compiled code under a dual license with neither text.
      - name: ship the license texts
        working-directory: crates/pincel-wasm/pkg
        run: npm pkg set "files[]=LICENSE-MIT" "files[]=LICENSE-APACHE"
      - name: publish
        working-directory: crates/pincel-wasm/pkg
        run: npm publish --access public
