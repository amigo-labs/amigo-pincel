# Checks the project data for amigo-labs.dev: validates docs/site/ against the
# site's schema and fails when assets/brand/ (the app icons made from the pixel
# monogram) or ui/src/theme/ (the shared amigo app theme with Pincel's accent,
# docs/specs/amigo-theme.md) no longer matches docs/site/project.yml. The
# checks live in amigo-labs/website (docs/project-data.md); regenerate there:
# `node scripts/monogram.ts amigo-labs/amigo-pincel --out ../amigo-pincel/assets/brand`
# `node scripts/theme.ts amigo-labs/amigo-pincel --out ../amigo-pincel/ui/src/theme`

name: Site data

on:
  pull_request:
    paths:
      - docs/site/**
      - assets/brand/**
      - ui/src/theme/**
      - .github/workflows/site-data.yml

permissions:
  contents: read

jobs:
  site-data:
    uses: amigo-labs/website/.github/workflows/validate-project.yml@main
    with:
      theme-dir: ui/src/theme
